name: Test Hachinohe fixture extraction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official J.League fixture extraction without publishing
        run: python scripts/test_hachinohe.py
