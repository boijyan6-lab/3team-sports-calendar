name: Update Urawa cup fixtures (pilot)

on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract confirmed Urawa cup fixtures
        run: python scripts/update_urawa.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixtures_auto.json
          git diff --cached --quiet || (git commit -m 'Refresh confirmed Urawa cup fixtures' && git push)
