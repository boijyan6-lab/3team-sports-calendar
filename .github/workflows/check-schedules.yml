name: Check official schedule sources

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official sites
        run: python scripts/check_sources.py
      - name: Save monitoring results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source_state.json schedule_check_report.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update official schedule source monitoring'
            git push
          fi
