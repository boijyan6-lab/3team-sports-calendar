let team='all', futureOnly=true;
function fmt(d){const x=new Date(d+'T00:00:00');return `${x.getMonth()+1}/${x.getDate()} (${['日','月','火','水','木','金','土'][x.getDay()]})`}
function monthKey(d){return d.slice(0,7)}
function monthTitle(k){const [y,m]=k.split('-');return `${y}年${Number(m)}月`}
function todayJst(){
 const parts=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const values=Object.fromEntries(parts.map(p=>[p.type,p.value]));
 return `${values.year}-${values.month}-${values.day}`;
}
function render(){
 const today=todayJst();
 let arr=initial.filter(e=>team==='all'||e.team===team);
 if(futureOnly) arr=arr.filter(e=>e.date>=today);
 let html='', cur='';
 for(const e of arr){
  const mk=monthKey(e.date); if(mk!==cur){cur=mk;html+=`<div class="month">${monthTitle(mk)}</div>`}
  const isToday=e.date===today;
  html+=`<div class="card${isToday?' today':''}" data-team="${e.team}"><div class="row"><div class="date">${fmt(e.date)}${e.dateEnd?' または '+fmt(e.dateEnd):''} ${e.time||'時刻未定'}${isToday?'<span class="todayBadge">今日</span>':''}</div><div class="team">${e.teamLabel}</div></div>
  <div class="title">${e.opp==='未定'?e.comp:`${e.opp}戦`}</div>
  <div class="meta">${e.comp} ・ ${e.ha==='H'?'ホーム':e.ha==='A'?'アウェイ':'会場条件なし'}${e.venue?'（'+e.venue+'）':''} ・ 視聴: ${e.watch}</div>
  ${e.note?`<div class="meta cond">${e.note}</div>`:''}
  ${e.conditional?`<div class="meta cond">${e.conditionLabel||'※勝ち上がった場合'}</div>`:''}</div>`
 }
 document.getElementById('list').innerHTML=html||'<div class="card">該当する予定はありません。</div>';
}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');team=b.dataset.team;render()});
document.getElementById('todayBtn').onclick=()=>{futureOnly=true;document.getElementById('todayBtn').classList.add('activeView');document.getElementById('allBtn').classList.remove('activeView');render()};
document.getElementById('allBtn').onclick=()=>{futureOnly=false;document.getElementById('allBtn').classList.add('activeView');document.getElementById('todayBtn').classList.remove('activeView');render()};

async function checkLatest(){
 const p=document.getElementById('checkPanel'), btn=document.getElementById('checkBtn');
 p.style.display='block'; p.innerHTML='公式情報を確認中…'; btn.disabled=true;
 const urls=[
  ['ヤクルト','https://r.jina.ai/https://www.yakult-swallows.co.jp/game'],
  ['浦和','https://r.jina.ai/https://www.jleague.jp/club/urawa/day/'],
  ['八戸','https://r.jina.ai/https://www.jleague.jp/club/hachinohe/']
 ];
 let out=[];
 for(const [name,url] of urls){
  try{
   const r=await fetch(url,{cache:'no-store'});
   if(!r.ok) throw new Error();
   const t=await r.text();
   const has2027=/2027\//.test(t)||/2027年/.test(t);
   out.push(`<div class="ok">✓ ${name}：公式ページ取得成功${has2027?'（2027年表記あり）':''}</div>`);
  }catch(e){
   out.push(`<div class="warn">△ ${name}：自動確認できませんでした</div>`);
  }
 }
 p.innerHTML=out.join('')+`<div style="margin-top:8px;color:#6b7280">このボタンは公式ページの取得確認のみです。新しい日程は、更新を依頼いただいた際に公式情報を確認して反映します。公開サイトへの反映は更新ZIPをアップロードしてください。</div>`;
 btn.disabled=false;
}
document.getElementById('checkBtn').onclick=checkLatest;
// Confirmed cup fixtures from the official J.League Data Site, generated by GitHub Actions.
fetch('fixtures_auto.json?ts='+Date.now(),{cache:'no-store'})
 .then(r=>{if(!r.ok) throw new Error('no automatic data');return r.json()})
 .then(items=>{
  if(!Array.isArray(items)) return;
  for(const e of items){
   if(e.team!=='urawa'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!e.opp)continue;
   // Replace existing placeholder/confirmed cup entry on the same day; avoid duplicates.
   const isCup=x=>x.team==='urawa'&&(/ルヴァン|天皇杯/.test(x.comp));
   const matches=initial.filter(x=>isCup(x)&&x.date===e.date);
   if(matches.length){
     const target=matches.find(x=>x.opp==='未定')||matches[0];
     Object.assign(target,e,{conditional:false});
   }else initial.push({...e,conditional:false});
  }
  initial.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  render();
 }).catch(()=>{});
render();
</script>
